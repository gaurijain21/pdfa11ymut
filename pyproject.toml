[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfa11ymut"
version = "0.2.0"
description = "Reproducible mutation and verification pipeline for PDF accessibility validator evaluation"
requires-python = ">=3.10"
dependencies = ["pypdf==6.18.1", "Pillow>=10,<13", "PyYAML>=6,<7", "PyMuPDF>=1.24,<2"]

[project.scripts]
pdfa11ymut = "pdfa11ymut.cli:main"

[tool.setuptools.packages.find]
include = ["pdfa11ymut*"]
